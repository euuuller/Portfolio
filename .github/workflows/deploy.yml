name: Build e deploy no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Orçamento de peso
        run: node scripts/check-budget.mjs

      - name: Links internos
        run: node scripts/check-links.mjs

      # O servidor do LHCI serve a raiz; a cópia reproduz o `base` do site.
      - name: Lighthouse CI
        run: |
          BASE=$(node --input-type=module -e "import { BASE } from './scripts/dist.mjs'; console.log(BASE)")
          mkdir -p ".lhci-site${BASE}" && cp -r dist/. ".lhci-site${BASE}"
          npx --yes @lhci/cli@0.15.1 autorun --collect.url="http://localhost${BASE}"

      - name: Relatórios do Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: lighthouse-reports/
          retention-days: 14

      - name: Publicar artefato do Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verificação pós-deploy
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$PAGE_URL" | grep -q '<html lang="pt-BR"'
          curl -fsS -o /dev/null --retry 3 --retry-delay 5 --retry-all-errors "${PAGE_URL%/}/sitemap-index.xml"
